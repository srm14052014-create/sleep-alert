<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Driver Sleep Alert (Face Lock)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; text-align: center; padding: 12px; transition: background 0.15s; }
    body.alarm-bg { background: #991b1b; }
    .row { display: flex; gap: 8px; margin-bottom: 10px; }
    button { flex: 1; padding: 14px 6px; font-size: 14px; font-weight: 700; border: none; border-radius: 10px; background: #2563eb; color: #fff; }
    button:disabled { background: #334155; color: #94a3b8; }
    #calBtn { background: #d97706; }
    #usbBtn { background: #0d9488; }
    #testBtn { background: #475569; max-width: 70px; }
    #status { padding: 12px; border-radius: 10px; background: #1e293b; font-size: 17px; font-weight: 800; margin-bottom: 8px; color: #4ade80; }
    #eyeInfo { font-size: 14px; font-weight: 700; margin-bottom: 8px; color: #cbd5e1; }
    .slider-box { background: #1e293b; padding: 10px; border-radius: 10px; margin-bottom: 10px; }
    .slider-box label { display: block; font-size: 13px; margin-bottom: 6px; color: #94a3b8; }
    input[type="range"] { width: 100%; accent-color: #3b82f6; }
    .alert { background: #dc2626 !important; color: #fff !important; }
    video { width: 100%; max-width: 320px; border-radius: 12px; transform: scaleX(-1); background: #000; display: block; margin: 0 auto; }
  </style>
</head>
<body>
  <div class="row">
    <button id="startBtn" type="button">1. Start</button>
    <button id="calBtn" type="button" disabled>2. Set Open</button>
    <button id="usbBtn" type="button">Arduino</button>
    <button id="testBtn" type="button">Test</button>
  </div>

  <div id="status">Tap "1. Start" to Open Camera</div>
  <div id="eyeInfo">Face Lock: Ready</div>

  <div class="slider-box">
    <label id="sensLabel">Sensitivity Trigger: 97%</label>
    <input type="range" id="sensSlider" min="80" max="99" value="97" />
  </div>

  <video id="cam" autoplay playsinline muted></video>
  <canvas id="proc" width="160" height="120" style="display:none;"></canvas>

  <script>
    const statusEl = document.getElementById("status");
    const eyeInfoEl = document.getElementById("eyeInfo");
    const sensSlider = document.getElementById("sensSlider");
    const sensLabel = document.getElementById("sensLabel");
    const video = document.getElementById("cam");
    const canvas = document.getElementById("proc");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });

    const startBtn = document.getElementById("startBtn");
    const calBtn = document.getElementById("calBtn");
    const usbBtn = document.getElementById("usbBtn");
    const testBtn = document.getElementById("testBtn");

    const ALARM_SECONDS = 3.0;
    let writer = null, closedMs = 0, lastTime = 0, lastCmd = "", audioCtx = null, lastBeep = 0;
    let openBaseline = null;
    let currentScore = 0;
    let lockX = 80, lockY = 50; // Smoothed face center coordinates

    sensSlider.addEventListener("input", () => {
      sensLabel.textContent = `Sensitivity Trigger: ${sensSlider.value}%`;
    });

    function playAlarm() {
      const now = performance.now();
      if (now - lastBeep < 260) return;
      lastBeep = now;

      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(980, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1450, audioCtx.currentTime + 0.16);
      gain.gain.setValueAtTime(1.0, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.18);

      if ("vibrate" in navigator) navigator.vibrate(200);
    }

    function sendArduino(cmd) {
      if (writer && cmd !== lastCmd) {
        lastCmd = cmd;
        writer.write(new TextEncoder().encode(cmd)).catch(() => {
          writer = null;
          usbBtn.textContent = "Arduino";
          usbBtn.disabled = false;
        });
      }
    }

    testBtn.addEventListener("click", () => {
      playAlarm();
      sendArduino("1");
      setTimeout(() => sendArduino("0"), 500);
    });

    usbBtn.addEventListener("click", async () => {
      try {
        if (!("serial" in navigator)) {
          statusEl.textContent = "Use Chrome with USB OTG for Arduino";
          return;
        }
        const port = await navigator.serial.requestPort();
        await port.open({ baudRate: 9600 });
        writer = port.writable.getWriter();
        usbBtn.textContent = "Linked";
        usbBtn.disabled = true;
      } catch (e) {
        statusEl.textContent = "Phone Speaker Mode Active";
      }
    });

    calBtn.addEventListener("click", () => {
      openBaseline = currentScore;
      closedMs = 0;
      statusEl.textContent = "Face Locked & Calibrated!";
    });

    startBtn.addEventListener("click", async () => {
      startBtn.disabled = true;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") await audioCtx.resume();
      if ("wakeLock" in navigator) navigator.wakeLock.request("screen").catch(() => {});

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 320 }, height: { ideal: 240 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        calBtn.disabled = false;
        lastTime = performance.now();
        requestAnimationFrame(loop);
      } catch (err) {
        statusEl.textContent = "Camera Error: " + err.message;
        startBtn.disabled = false;
      }
    });

    // Finds face skin-tone center and tracks eye band locked onto your face
    function trackFaceAndMeasureEyes() {
      ctx.drawImage(video, 0, 0, 160, 120);
      const full = ctx.getImageData(0, 0, 160, 120).data;

      let sumX = 0, sumY = 0, skinCount = 0;
      for (let y = 10; y < 110; y += 2) {
        for (let x = 20; x < 140; x += 2) {
          const idx = (y * 160 + x) * 4;
          const r = full[idx], g = full[idx + 1], b = full[idx + 2];
          // Skin tone filter (works across light to deep skin tones)
          if (r > 60 && g > 35 && b > 20 && r > g && r > b && Math.abs(r - g) > 10) {
            sumX += x;
            sumY += y;
            skinCount++;
          }
        }
      }

      const faceFound = skinCount > 120;
      if (faceFound) {
        const targetX = sumX / skinCount;
        // Eyes sit slightly above the vertical centroid of the face
        const targetY = (sumY / skinCount) - 8;
        // Smoothly follow head movement without jitter
        lockX = lockX * 0.75 + targetX * 0.25;
        lockY = lockY * 0.75 + targetY * 0.25;
      }

      // Clamp eye window inside 160x120 frame
      const w = 76, h = 28;
      const startX = Math.max(2, Math.min(160 - w - 2, Math.round(lockX - w / 2)));
      const startY = Math.max(2, Math.min(120 - h - 2, Math.round(lockY - h / 2)));

      const img = ctx.getImageData(startX, startY, w, h).data;
      let edgeSum = 0;

      for (let y = 1; y < h - 1; y++) {
        for (let x = 0; x < w; x++) {
          const idxAbove = ((y - 1) * w + x) * 4;
          const idxBelow = ((y + 1) * w + x) * 4;
          const lumAbove = 0.3 * img[idxAbove] + 0.59 * img[idxAbove + 1] + 0.11 * img[idxAbove + 2];
          const lumBelow = 0.3 * img[idxBelow] + 0.59 * img[idxBelow + 1] + 0.11 * img[idxBelow + 2];
          edgeSum += Math.abs(lumAbove - lumBelow);
        }
      }

      return { score: edgeSum / (w * h), faceFound };
    }

    function loop(now) {
      if (now - lastTime >= 100) {
        const dt = now - lastTime;
        lastTime = now;

        const { score, faceFound } = trackFaceAndMeasureEyes();
        currentScore = score;

        if (!faceFound) {
          closedMs = 0;
          eyeInfoEl.textContent = "Face Lock: Searching for face...";
          statusEl.textContent = "Align Face in Camera";
          statusEl.classList.remove("alert");
          document.body.classList.remove("alarm-bg");
          sendArduino("0");
          requestAnimationFrame(loop);
          return;
        }

        if (openBaseline === null && currentScore > 1) {
          openBaseline = currentScore;
        }

        const ratio = openBaseline ? (currentScore / openBaseline) * 100 : 100;
        const threshold = Number(sensSlider.value);
        const isClosed = ratio < threshold;

        if (isClosed) {
          closedMs += dt;
        } else {
          closedMs = 0;
        }

        const sec = (closedMs / 1000).toFixed(1);
        eyeInfoEl.textContent = isClosed
          ? `Face Locked • CLOSED (${sec}s / 3.0s) • ${ratio.toFixed(0)}%`
          : `Face Locked • OPEN • Level: ${ratio.toFixed(0)}% (< ${threshold}%)`;

        if (closedMs >= ALARM_SECONDS * 1000) {
          statusEl.textContent = writer ? "WAKE UP! (ARDUINO + PHONE)" : "WAKE UP! EYES CLOSED 3s!";
          statusEl.classList.add("alert");
          document.body.classList.add("alarm-bg");
          playAlarm();
          sendArduino("1");
        } else {
          statusEl.textContent = writer ? "Face Locked • Arduino Linked" : "Face Locked • Monitoring";
          statusEl.classList.remove("alert");
          document.body.classList.remove("alarm-bg");
          sendArduino("0");
        }
      }
      requestAnimationFrame(loop);
    }
  </script>
</body>
</html>
