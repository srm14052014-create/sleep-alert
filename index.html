<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver Sleep Alert - Competition Edition</title>
  <style>
    :root{--bg:#0b0f19;--card:#151c2c;--accent:#3b82f6;--ok:#10b981;--bad:#ef4444}
    body{font-family:system-ui,sans-serif;background:var(--bg);color:#f8fafc;text-align:center;margin:0;padding:14px}
    h2{margin:4px 0 12px;font-size:20px;letter-spacing:.5px}
    .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
    button{padding:10px 14px;font-size:14px;font-weight:700;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
    button:disabled{background:#334155;color:#94a3b8;cursor:not-allowed}
    #bArd.connected{background:var(--ok)}
    .box{position:relative;max-width:440px;margin:0 auto;border-radius:12px;overflow:hidden;border:3px solid #1e293b;background:#000}
    video,canvas{width:100%;display:block;transform:scaleX(-1)}
    canvas{position:absolute;top:0;left:0}
    .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:440px;margin:12px auto}
    .m-card{background:var(--card);padding:10px;border-radius:10px;border:1px solid #1e293b}
    .m-val{font-size:20px;font-weight:800;color:#38bdf8}
    .m-lbl{font-size:11px;color:#94a3b8;text-transform:uppercase;margin-top:2px}
    .status{max-width:440px;margin:0 auto;padding:14px;border-radius:12px;background:var(--card);border:1px solid #1e293b;font-size:16px;font-weight:700}
    .alarm{background:var(--bad)!important;animation:p .4s infinite alternate}
    @keyframes p{from{opacity:1}to{opacity:.75}}
    .slider-row{margin-top:10px;font-size:13px;color:#cbd5e1;font-weight:400}
  </style>
</head>
<body>
  <h2>DRIVER SLEEP ALERT SYSTEM</h2>
  <div class="row">
    <button id="bStart">1. Start Camera</button>
    <button id="bSet" disabled>2. Calibrate Eyes</button>
    <button id="bArd">3. Pair Nano</button>
    <button id="bTest" disabled>Test Hardware</button>
  </div>

  <div class="box">
    <video id="v" autoplay playsinline muted></video>
    <canvas id="c"></canvas>
  </div>

  <div class="metrics">
    <div class="m-card"><div class="m-val" id="mOpen">--%</div><div class="m-lbl">Eye Openness</div></div>
    <div class="m-card"><div class="m-val" id="mAlerts">0</div><div class="m-lbl">Alerts Triggered</div></div>
    <div class="m-card"><div class="m-val" id="mHw" style="color:#94a3b8">OFFLINE</div><div class="m-lbl">Arduino Nano</div></div>
  </div>

  <div id="st" class="status">
    <div id="txt">Tap "1. Start Camera" to initialize</div>
    <div class="slider-row">
      Sensitivity: <b id="sv">80</b>% <input type="range" id="sl" min="55" max="95" value="80">
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const v = $("v"), c = $("c"), ctx = c.getContext("2d", { willReadFrequently: true });
    let fd = null, wr = null, baseDark = 0, curDark = 0, t0 = null, on = false, ac = null, alerts = 0;

    if ("FaceDetector" in window) {
      fd = new FaceDetector({ fastMode: true, maxDetectedFaces: 2 });
    }

    $("sl").oninput = e => $("sv").textContent = e.target.value;

    $("bStart").onclick = async () => {
      $("bStart").disabled = true;
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      v.srcObject = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 320 }, height: { ideal: 240 } }
      });
      v.onloadeddata = () => {
        c.width = v.videoWidth; c.height = v.videoHeight;
        $("bSet").disabled = false;
        loop();
      };
    };

    $("bSet").onclick = () => {
      baseDark = curDark;
      $("txt").textContent = "Baseline Locked! Driver Ready";
    };

    $("bArd").onclick = async () => {
      try {
        const p = await navigator.serial.requestPort();
        await p.open({ baudRate: 9600 });
        wr = p.writable.getWriter();
        $("bTest").disabled = false;
        $("bArd").textContent = "Nano Paired";
        $("bArd").classList.add("connected");
        $("mHw").textContent = "READY";
        $("mHw").style.color = "#10b981";
        send("0"); // Ensure Green LED turns ON
      } catch (e) { alert("Serial Error: " + e.message); }
    };

    $("bTest").onclick = () => {
      alarm(true, true);
      setTimeout(() => alarm(false, true), 1200);
    };

    const send = s => wr && wr.write(new TextEncoder().encode(s));

    function beep() {
      if (!on || !ac) return;
      const o = ac.createOscillator(); o.type = "square"; o.frequency.value = 920;
      o.connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.15);
      setTimeout(beep, 300);
    }

    function alarm(act, isTest = false) {
      if (act === on) return;
      on = act;
      $("st").classList.toggle("alarm", act);
      send(act ? "1" : "0");
      if (act) {
        if (!isTest) {
          alerts++;
          $("mAlerts").textContent = alerts;
        }
        beep();
      }
    }

    function measureEyeOpenness(x, y, w, h) {
      const img = ctx.getImageData(x, y, w, h).data;
      let darkPixels = 0, totalBrightness = 0;
      for (let i = 0; i < img.length; i += 4) {
        totalBrightness += (img[i] + img[i + 1] + img[i + 2]) / 3;
      }
      const avg = totalBrightness / (img.length / 4);
      for (let i = 0; i < img.length; i += 4) {
        const b = (img[i] + img[i + 1] + img[i + 2]) / 3;
        if (b < avg * 0.65) darkPixels++;
      }
      return darkPixels / (img.length / 4);
    }

    async function loop() {
      ctx.drawImage(v, 0, 0, c.width, c.height);
      let box = { x: c.width * 0.25, y: c.height * 0.2, width: c.width * 0.5, height: c.height * 0.6 };
      let locked = false;

      if (fd) {
        try {
          const faces = await fd.detect(c);
          if (faces.length > 0) {
            box = faces.reduce((a, b) => b.boundingBox.width > a.boundingBox.width ? b : a).boundingBox;
            locked = true;
          }
        } catch (e) {}
      } else {
        locked = true;
      }

      if (locked) {
        const ex = Math.max(0, Math.floor(box.x + box.width * 0.15));
        const ey = Math.max(0, Math.floor(box.y + box.height * 0.28));
        const ew = Math.min(c.width - ex, Math.floor(box.width * 0.70));
        const eh = Math.min(c.height - ey, Math.floor(box.height * 0.16));

        curDark = measureEyeOpenness(ex, ey, ew, eh);
        if (!baseDark) baseDark = curDark;

        const openPct = Math.min(100, Math.round((curDark / baseDark) * 100));
        $("mOpen").textContent = openPct + "%";

        const threshold = baseDark * ($("sl").value / 100);
        const eyesClosed = curDark < threshold;

        ctx.strokeStyle = eyesClosed ? "#ef4444" : "#10b981";
        ctx.lineWidth = 2;
        ctx.strokeRect(box.x, box.y, box.width, box.height);
        ctx.strokeRect(ex, ey, ew, eh);

        if (eyesClosed) {
          t0 = t0 || performance.now();
          const dt = performance.now() - t0;
          if (dt > 1000) { // 1.0s fast demo trigger
            $("txt").textContent = "ALERT: DRIVER DROWSINESS DETECTED!";
            alarm(true);
          } else {
            $("txt").textContent = `Eyes Closing... ${(dt / 1000).toFixed(1)}s`;
          }
        } else {
          t0 = null;
          alarm(false);
          $("txt").textContent = "STATUS: SAFE (DRIVER AWAKE)";
        }
      } else {
        t0 = null;
        alarm(false);
        $("mOpen").textContent = "--%";
        $("txt").textContent = "Searching for driver face...";
      }

      requestAnimationFrame(loop);
    }
  </script>
</body>
</html>
