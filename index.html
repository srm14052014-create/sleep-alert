<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Driver Sleep Alert</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; text-align: center; padding: 14px; transition: background 0.15s; }
    body.alarm-bg { background: #991b1b; }
    .row { display: flex; gap: 8px; margin-bottom: 10px; }
    button { flex: 1; padding: 14px 8px; font-size: 15px; font-weight: 700; border: none; border-radius: 10px; background: #2563eb; color: #fff; }
    button:disabled { background: #334155; color: #94a3b8; }
    #calBtn { background: #d97706; }
    #usbBtn { background: #0d9488; }
    #testBtn { background: #475569; max-width: 75px; }
    #status { padding: 14px; border-radius: 10px; background: #1e293b; font-size: 17px; font-weight: 800; margin-bottom: 8px; color: #4ade80; }
    #eyeInfo { font-size: 15px; font-weight: 600; margin-bottom: 10px; color: #cbd5e1; }
    .alert { background: #dc2626 !important; color: #fff !important; }
    video { width: 100%; max-width: 340px; border-radius: 12px; transform: scaleX(-1); background: #000; display: block; margin: 0 auto; }
  </style>
</head>
<body>
  <div class="row">
    <button id="startBtn" type="button">1. Start</button>
    <button id="calBtn" type="button" disabled>2. Set Open</button>
    <button id="usbBtn" type="button">Arduino</button>
    <button id="testBtn" type="button">Test</button>
  </div>
  <div id="status">Tap "1. Start" to Open Camera</div>
  <div id="eyeInfo">Eyes: Waiting...</div>

  <video id="cam" autoplay playsinline muted></video>
  <canvas id="proc" width="160" height="120" style="display:none;"></canvas>

  <script>
    const statusEl = document.getElementById("status");
    const eyeInfoEl = document.getElementById("eyeInfo");
    const video = document.getElementById("cam");
    const canvas = document.getElementById("proc");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });

    const startBtn = document.getElementById("startBtn");
    const calBtn = document.getElementById("calBtn");
    const usbBtn = document.getElementById("usbBtn");
    const testBtn = document.getElementById("testBtn");

    const ALARM_SECONDS = 3.0;
    let writer = null, closedMs = 0, lastTime = 0, lastCmd = "", audioCtx = null, lastBeep = 0;
    let openBaseline = null;
    let currentContrast = 0;

    function playAlarm() {
      const now = performance.now();
      if (now - lastBeep < 260) return;
      lastBeep = now;

      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(980, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1450, audioCtx.currentTime + 0.16);
      gain.gain.setValueAtTime(1.0, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.18);

      if ("vibrate" in navigator) navigator.vibrate(200);
    }

    function sendArduino(cmd) {
      if (writer && cmd !== lastCmd) {
        lastCmd = cmd;
        writer.write(new TextEncoder().encode(cmd)).catch(() => {
          writer = null;
          usbBtn.textContent = "Arduino";
          usbBtn.disabled = false;
        });
      }
    }

    testBtn.addEventListener("click", () => {
      playAlarm();
      sendArduino("1");
      setTimeout(() => sendArduino("0"), 500);
    });

    usbBtn.addEventListener("click", async () => {
      try {
        if (!("serial" in navigator)) {
          statusEl.textContent = "Use Chrome with USB OTG for Arduino";
          return;
        }
        const port = await navigator.serial.requestPort();
        await port.open({ baudRate: 9600 });
        writer = port.writable.getWriter();
        usbBtn.textContent = "Linked";
        usbBtn.disabled = true;
      } catch (e) {
        statusEl.textContent = "Phone Speaker Mode Active";
      }
    });

    calBtn.addEventListener("click", () => {
      openBaseline = currentContrast;
      closedMs = 0;
      statusEl.textContent = "Calibrated! Monitoring Active";
    });

    startBtn.addEventListener("click", async () => {
      startBtn.disabled = true;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") await audioCtx.resume();
      if ("wakeLock" in navigator) navigator.wakeLock.request("screen").catch(() => {});

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 320 }, height: { ideal: 240 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        calBtn.disabled = false;
        lastTime = performance.now();
        requestAnimationFrame(loop);
      } catch (err) {
        statusEl.textContent = "Camera Error: " + err.message;
        startBtn.disabled = false;
      }
    });

    function measureEyeContrast() {
      ctx.drawImage(video, 0, 0, 160, 120);
      const img = ctx.getImageData(30, 35, 100, 35).data;
      let sum = 0, sumSq = 0, count = img.length / 4;

      for (let i = 0; i < img.length; i += 4) {
        const lum = 0.299 * img[i] + 0.587 * img[i + 1] + 0.114 * img[i + 2];
        sum += lum;
        sumSq += lum * lum;
      }
      const mean = sum / count;
      const variance = (sumSq / count) - (mean * mean);
      return Math.sqrt(Math.max(0, variance));
    }

    function loop(now) {
      if (now - lastTime >= 100) {
        const dt = now - lastTime;
        lastTime = now;

        currentContrast = measureEyeContrast();

        if (openBaseline === null && currentContrast > 5) {
          openBaseline = currentContrast;
        }

        const isClosed = openBaseline && (currentContrast < openBaseline * 0.80);

        if (isClosed) {
          closedMs += dt;
        } else {
          closedMs = 0;
          if (openBaseline) openBaseline = openBaseline * 0.97 + currentContrast * 0.03;
        }

        const sec = (closedMs / 1000).toFixed(1);
        eyeInfoEl.textContent = isClosed
          ? `Eyes: CLOSED (${sec}s / 3.0s)`
          : `Eyes: OPEN`;

        if (closedMs >= ALARM_SECONDS * 1000) {
          statusEl.textContent = writer ? "WAKE UP! (ARDUINO + PHONE)" : "WAKE UP! EYES CLOSED 3s!";
          statusEl.classList.add("alert");
          document.body.classList.add("alarm-bg");
          playAlarm();
          sendArduino("1");
        } else {
          statusEl.textContent = writer ? "Monitoring (Arduino Linked)" : "Monitoring (Phone Active)";
          statusEl.classList.remove("alert");
          document.body.classList.remove("alarm-bg");
          sendArduino("0");
        }
      }
      requestAnimationFrame(loop);
    }
  </script>
</body>
</html>
